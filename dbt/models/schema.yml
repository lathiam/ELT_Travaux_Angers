version: 2

sources:
  - name: travaux_angers
    database: my-project-travaux-angers   # adapte si besoin
    schema: travaux_angers
    tables:
      - name: travaux_angers
        description: "Table source des travaux d'Angers"

models:

  # -------------------------
  # BRONZE
  # -------------------------
  - name: src_travaux_angers
    schema: bronze
    description: "Bronze enrichi : parsing dates/times, normalisation géo, dédoublonnage minimal"
    columns:
      - name: id
        tests: [not_null]
      - name: start_date
        tests:
          - not_null:
              config: {severity: warn}
      - name: end_date
        tests:
          - dbt_utils.expression_is_true:
              expression: "(end_date IS NULL) OR (end_date >= start_date)"
              config: {severity: warn}
      - name: position_wkt
        tests:
          - not_null:
              config: {severity: warn}
      - name: type_norm
        tests:
          - not_null:
              config: {severity: warn}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id
            - title
            - address
            - start_at
            - end_at
            - position_wkt
          config: {severity: warn}

  # -------------------------
  # SILVER
  # -------------------------
  - name: stg_travaux_angers
    schema: silver
    description: "Staging 1:1 (typé/normalisé, géométrie prête)"
    columns:
      - name: id
        tests:
          - not_null
      - name: start_date
        tests:
          - not_null:
              config: {severity: warn}
      - name: end_date
        tests:
          - dbt_utils.expression_is_true:
              expression: "(end_date IS NULL) OR (end_date >= start_date)"
              config: {severity: warn}
      - name: type_norm
        tests:
          - not_null:
              config: {severity: warn}
      - name: a_geometrie
        tests:
          - accepted_values:
              values: ['Oui', 'Non']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - id
            - start_at
            - end_at
            - title
            - address
            - position_wkt
          config: {severity: warn}

  # -------------------------
  # GOLD - DIM
  # -------------------------
  - name: dim_travaux_details
    schema: gold
    description: "Dimension des travaux : attributs métier, statut, impact, géométrie"
    columns:
      - name: id
        tests: [unique, not_null]
      - name: titre
        tests:
          - not_null:
              config: {severity: warn}
      - name: type_travaux
        tests:
          - not_null:
              config: {severity: warn}
      - name: date_debut
        tests:
          - not_null:
              config: {severity: warn}
      - name: date_fin
        tests:
          - dbt_utils.expression_is_true:
              expression: "(date_fin IS NULL) OR (date_fin >= date_debut)"
              config: {severity: warn}
      - name: duree_prevue
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
              config:
                where: "duree_prevue IS NOT NULL"
      - name: impact_circulation
        tests:
          - accepted_values:
              values: ['FORT', 'MOYEN', 'FAIBLE']
      - name: position
        tests:
          - not_null:
              config: {severity: warn}
      - name: en_retard
        tests:
          - accepted_values:
              values: ['Oui', 'Non']
      - name: retard_jours
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  # -------------------------
  # GOLD - FACT (jour x chantier)
  # -------------------------
  - name: fct_travaux_stats
    schema: gold
    description: "Faits journaliers (jour x chantier) + agrégats par type"
    columns:
      - name: date_jour
        tests: [not_null]
      - name: travaux_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_travaux_details')
              field: id
      - name: type_travaux
        tests:
          - not_null:
              config: {severity: warn}
      - name: niveau_impact
        tests:
          - accepted_values:
              values: ['FORT', 'MOYEN', 'FAIBLE']
      - name: mois
        tests:
          - not_null:
              config: {severity: warn}
      - name: jour_semaine
        tests:
          - not_null:
              config: {severity: warn}
      - name: est_actif
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: en_retard
        tests:
          - accepted_values:
              values: ['Oui', 'Non']
      - name: a_geometrie
        tests:
          - accepted_values:
              values: ['Oui', 'Non']
      - name: taux_occupation
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                where: "taux_occupation IS NOT NULL"
      - name: taux_retard
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                where: "taux_retard IS NOT NULL"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['travaux_id', 'date_jour']

  # -------------------------
  # GOLD - FACT GEO
  # -------------------------
  - name: fct_travaux_stats_geo
    schema: gold
    description: "Faits journaliers filtrés avec géométrie + dérivés géo"
    columns:
      - name: a_geometrie
        tests:
          - accepted_values:
              values: ['Oui']
      - name: position_wkt
        tests: [not_null]
      - name: travaux_id
        tests:
          - relationships:
              to: ref('dim_travaux_details')
              field: id
